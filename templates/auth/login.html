{% extends "base.html" %}

{% block title %}Login - Algerian Universities AI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <a href="{{ url_for('index') }}" class="back-to-home" title="Back to Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </a>

        <div class="auth-header">
            <div class="auth-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 data-i18n="login.title">Welcome Back</h1>
            <p  data-i18n="login.subtitle">Log in to continue to EduVerse AI</p>
        </div>

        {% from 'forms.html' import render_login_form %}
        {{ render_login_form() }}

        <div class="auth-footer">
            <p>
                <span data-i18n="login.no_account">Don't have an account?</span>
                <a href="{{ url_for('auth.signup') }}" data-i18n="login.signup_link">Sign up</a>
            </p>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
