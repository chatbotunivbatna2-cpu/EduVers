{% extends "base.html" %}

{% block title %}Verification Failed - Algerian Universities AI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card verification-card">
        <div class="verification-icon error">✗</div>
        <h1>Verification Failed</h1>
        <p>{{ message }}</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary" style="margin-top:20px;">Go to Login</a>
    </div>
</div>
{% endblock %}
