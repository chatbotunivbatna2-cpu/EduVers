services:

  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: eduverse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: akram2003
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d chatbot_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask web application
  web:
    build: .
    container_name: eduverse-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:akram2003@db:5432/chatbot_db
      REDIS_URL: redis://cache:6379/0
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy

  # Redis cache
  cache:
    image: redis:7-alpine
    container_name: eduverse-cache
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Telegram bot worker
  telegram-bot:
    build: .
    container_name: eduverse-telegram
    restart: unless-stopped
    command: python telegram_bot.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:akram2003@db:5432/chatbot_db
      REDIS_URL: redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
